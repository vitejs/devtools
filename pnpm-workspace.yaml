allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  rolldown: true
  simple-git-hooks: true
  unrs-resolver: true
  vue-demi: true
ignoreWorkspaceRootCheck: true
minimumReleaseAge: 0
verifyDepsBeforeRun: true
shamefullyHoist: true
shellEmulator: true
strictPeerDependencies: false
trustPolicy: no-downgrade
trustPolicyExclude:
  - langium
  - tinyexec
packages:
  - packages/*
  - examples/*
  - playgrounds/*
  - '!playgrounds/production'
  - '!playgrounds/production-nuxt'
  - docs
  - e2e
  - storybook

overrides:
  # provenance downgrade (https://npmx.dev/package-timeline/@humanwhocodes/momoa/v/3.3.10)
  '@humanwhocodes/momoa': 3.3.10
  '@jridgewell/sourcemap-codec': 'catalog:resolutions'
  '@nuxt/devtools': 'catalog:devtools'
  '@nuxt/kit': 'catalog:build'
  '@nuxt/vite-builder': 'catalog:build'
  '@rolldown/debug': 'catalog:deps'
  cac: 'catalog:deps'
  chokidar: 'catalog:devtools'
  esbuild: 'catalog:build'
  langium: 'catalog:resolutions'
  nitropack: 'catalog:build'
  nuxt: 'catalog:build'
  rolldown: 'catalog:build'
  semver: 'catalog:resolutions'
  twoslash: 'catalog:docs'
  vite: 'catalog:build'
refs:
  devframe: &devframe ^0.9.8
  nuxt: &nuxt ^4.5.2
  shiki: &shiki ^4.4.3
  storybook: &storybook ^10.5.10
  unocss: &unocss ^66.9.1
  vueuse: &vueuse ^14.4.0

